# Local Postgres for development and tests. Not used in deployment — the app
# talks to a Supabase-hosted instance there.
#
#   docker compose up -d
#   DATABASE_URL=postgresql+asyncpg://portfolio:portfolio@localhost:5432/portfolio
#   TEST_DATABASE_URL=postgresql+asyncpg://portfolio:portfolio@localhost:5432/portfolio_test

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the separate test database on first start.
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
